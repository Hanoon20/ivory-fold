<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 360" width="260" height="360">
<defs>

    <!-- building blocks -->
    <path id="petal" d="M0,-2 C15,-7 21,-23 9,-37 C5,-42 -5,-42 -9,-37 C-21,-23 -15,-7 0,-2 Z"/>

    <g id="leaf">
      <path d="M0,0 C9,-11 12,-27 0,-43 C-12,-27 -9,-11 0,0 Z"/>
      <path d="M0,-3 L0,-39" fill="none"/>
      <path d="M0,-12 L6,-19 M0,-20 L6,-27 M0,-12 L-6,-19 M0,-20 L-6,-27" fill="none"/>
    </g>

    <g id="bud">
      <path d="M0,0 C8,-8 9,-22 0,-30 C-9,-22 -8,-8 0,0 Z"/>
      <path d="M0,-1 C5,-9 5,-20 0,-27" fill="none"/>
      <path d="M0,0 C6,3 9,9 8,14 M0,0 C-6,3 -9,9 -8,14" fill="none"/>
    </g>

    <!-- a full bloom: four rings of petals, slightly irregular so it reads natural -->
    <g id="rose">
      <g transform="rotate(0) scale(1)">
        <use xlink:href="#petal" transform="rotate(-0.7) scale(1.01)"/>
        <use xlink:href="#petal" transform="rotate(41.9) scale(0.99)"/>
        <use xlink:href="#petal" transform="rotate(72.1) scale(1.02)"/>
        <use xlink:href="#petal" transform="rotate(103.6) scale(1.00)"/>
        <use xlink:href="#petal" transform="rotate(145.8) scale(1.05)"/>
        <use xlink:href="#petal" transform="rotate(174.3) scale(0.96)"/>
        <use xlink:href="#petal" transform="rotate(210.3) scale(1.06)"/>
        <use xlink:href="#petal" transform="rotate(254.7) scale(0.92)"/>
        <use xlink:href="#petal" transform="rotate(294.8) scale(1.08)"/>
        <use xlink:href="#petal" transform="rotate(326.2) scale(1.02)"/>
      </g>
      <g transform="rotate(20) scale(0.74)">
        <use xlink:href="#petal" transform="rotate(-4.8) scale(0.91)"/>
        <use xlink:href="#petal" transform="rotate(45.4) scale(0.92)"/>
        <use xlink:href="#petal" transform="rotate(85.7) scale(0.95)"/>
        <use xlink:href="#petal" transform="rotate(128.4) scale(0.99)"/>
        <use xlink:href="#petal" transform="rotate(179.2) scale(1.06)"/>
        <use xlink:href="#petal" transform="rotate(225.3) scale(1.03)"/>
        <use xlink:href="#petal" transform="rotate(270.0) scale(1.03)"/>
        <use xlink:href="#petal" transform="rotate(314.4) scale(0.96)"/>
      </g>
      <g transform="rotate(-13) scale(0.5)">
        <use xlink:href="#petal" transform="rotate(7.0) scale(1.09)"/>
        <use xlink:href="#petal" transform="rotate(64.8) scale(1.04)"/>
        <use xlink:href="#petal" transform="rotate(117.4) scale(0.95)"/>
        <use xlink:href="#petal" transform="rotate(177.0) scale(0.92)"/>
        <use xlink:href="#petal" transform="rotate(243.7) scale(0.98)"/>
        <use xlink:href="#petal" transform="rotate(304.9) scale(0.98)"/>
      </g>
      <g transform="rotate(33) scale(0.28)">
        <use xlink:href="#petal" transform="rotate(6.4) scale(1.06)"/>
        <use xlink:href="#petal" transform="rotate(83.0) scale(0.95)"/>
        <use xlink:href="#petal" transform="rotate(185.7) scale(0.99)"/>
        <use xlink:href="#petal" transform="rotate(276.7) scale(0.98)"/>
      </g>
      <circle r="2.6"/>
    </g>

    <!-- corner spray: stems, with leaves and blooms grown along them (260 x 360) -->
    <g id="spray">
      <g class="stems" fill="none">
        <path d="M16,14 C74,40 120,74 152,118"/>
        <path d="M152,118 C184,160 198,216 188,272"/>
        <path d="M22,116 C64,146 94,192 106,244"/>
        <path d="M106,244 C114,282 112,314 98,346"/>
        <path d="M152,118 C124,150 100,192 90,238"/>
        <path d="M16,14 C56,66 64,120 56,176"/>
      </g>
      <g class="leaves">
        <use xlink:href="#leaf" transform="translate(64.9,39.6) rotate(-116.5) scale(0.95)"/>
        <use xlink:href="#leaf" transform="translate(100.5,64.5) rotate(0.7) scale(0.85)"/>
        <use xlink:href="#leaf" transform="translate(131.1,92.8) rotate(-89.1) scale(0.8)"/>
        <use xlink:href="#leaf" transform="translate(172.5,151.9) rotate(32.8) scale(0.9)"/>
        <use xlink:href="#leaf" transform="translate(187.5,197.7) rotate(-63.1) scale(0.8)"/>
        <use xlink:href="#leaf" transform="translate(191.1,241.8) rotate(47.6) scale(0.72)"/>
        <use xlink:href="#leaf" transform="translate(56.4,147.0) rotate(-97.5) scale(0.88)"/>
        <use xlink:href="#leaf" transform="translate(84.9,187.9) rotate(21.7) scale(0.78)"/>
        <use xlink:href="#leaf" transform="translate(110.6,282.0) rotate(-51.3) scale(0.74)"/>
        <use xlink:href="#leaf" transform="translate(107.4,317.0) rotate(56.1) scale(0.66)"/>
        <use xlink:href="#leaf" transform="translate(121.0,160.8) rotate(84.7) scale(0.8)"/>
        <use xlink:href="#leaf" transform="translate(100.0,204.3) rotate(-27.4) scale(0.7)"/>
        <use xlink:href="#leaf" transform="translate(46.9,69.3) rotate(-80.1) scale(0.78)"/>
        <use xlink:href="#leaf" transform="translate(58.6,129.4) rotate(53.7) scale(0.68)"/>
      </g>
      <g class="buds">
        <use xlink:href="#bud" transform="translate(188.6,268.6) rotate(9.2) scale(0.85)"/>
        <use xlink:href="#bud" transform="translate(98.8,344.1) rotate(22.9) scale(0.8)"/>
        <use xlink:href="#bud" transform="translate(56.5,172.6) rotate(7.5) scale(0.72)"/>
        <use xlink:href="#bud" transform="translate(40.1,130.5) rotate(-47.9) scale(0.62)"/>
        <use xlink:href="#bud" transform="translate(91.6,231.1) rotate(14.0) scale(0.6)"/>
      </g>
      <g class="blooms">
        <use xlink:href="#rose" transform="translate(84,100) scale(1.18) rotate(6)"/>
        <use xlink:href="#rose" transform="translate(178,190) scale(0.82) rotate(-16)"/>
        <use xlink:href="#rose" transform="translate(70,292) scale(0.7) rotate(22)"/>
        <use xlink:href="#rose" transform="translate(206,300) scale(0.5) rotate(40)"/>
        <use xlink:href="#rose" transform="translate(30,52) scale(0.46) rotate(-30)"/>
        <use xlink:href="#rose" transform="translate(136,252) scale(0.44) rotate(12)"/>
      </g>
    </g>

    <!-- small upright sprig for the medallion -->
    <g id="sprig">
      <path d="M0,46 L0,-24" fill="none"/>
      <use xlink:href="#leaf" transform="translate(0,-22) scale(0.42)"/>
      <use xlink:href="#leaf" transform="translate(-2,10) rotate(-48) scale(0.46)"/>
      <use xlink:href="#leaf" transform="translate(2,10) rotate(48) scale(0.46)"/>
      <use xlink:href="#leaf" transform="translate(-2,30) rotate(-60) scale(0.38)"/>
      <use xlink:href="#leaf" transform="translate(2,30) rotate(60) scale(0.38)"/>
      <use xlink:href="#bud" transform="translate(-10,-2) rotate(-32) scale(0.32)"/>
      <use xlink:href="#bud" transform="translate(10,-2) rotate(32) scale(0.32)"/>
      <use xlink:href="#rose" transform="translate(0,0) scale(0.3)"/>
    </g>

    <!-- thin ornamental divider (200 x 26) -->
    <g id="rule">
      <path d="M4,12 L74,12 M126,12 L196,12" fill="none"/>
      <use xlink:href="#leaf" transform="translate(86,24) rotate(-64) scale(0.3)"/>
      <use xlink:href="#leaf" transform="translate(114,24) rotate(64) scale(0.3)"/>
      <use xlink:href="#rose" transform="translate(100,12) scale(0.26)"/>
    </g>

    <!-- embossed versions: shadow copy, highlight copy, face copy -->
    <g id="spray-emb">
      <use xlink:href="#spray" transform="translate(0,1.5)" style="fill:#b4897a;stroke:#b4897a" fill-opacity=".12" stroke-width=".8" opacity=".5" stroke-linecap="round" stroke-linejoin="round"/>
      <use xlink:href="#spray" transform="translate(0,-1.5)" style="fill:#fffaf7;stroke:#fffaf7" fill-opacity=".16" stroke-width=".8" opacity=".95" stroke-linecap="round" stroke-linejoin="round"/>
      <use xlink:href="#spray" style="fill:#f0dcd2;stroke:#e8d2c7" fill-opacity=".62" stroke-width=".7" opacity=".9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="sprig-emb">
      <use xlink:href="#sprig" transform="translate(0,1.5)" style="fill:#b4897a;stroke:#b4897a" fill-opacity=".12" stroke-width=".8" opacity=".5" stroke-linecap="round" stroke-linejoin="round"/>
      <use xlink:href="#sprig" transform="translate(0,-1.5)" style="fill:#fffaf7;stroke:#fffaf7" fill-opacity=".16" stroke-width=".8" opacity=".95" stroke-linecap="round" stroke-linejoin="round"/>
      <use xlink:href="#sprig" style="fill:#f0dcd2;stroke:#e8d2c7" fill-opacity=".62" stroke-width=".7" opacity=".9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="rule-emb">
      <use xlink:href="#rule" transform="translate(0,1.5)" style="fill:#b4897a;stroke:#b4897a" fill-opacity=".12" stroke-width=".8" opacity=".5" stroke-linecap="round" stroke-linejoin="round"/>
      <use xlink:href="#rule" transform="translate(0,-1.5)" style="fill:#fffaf7;stroke:#fffaf7" fill-opacity=".16" stroke-width=".8" opacity=".95" stroke-linecap="round" stroke-linejoin="round"/>
      <use xlink:href="#rule" style="fill:#f0dcd2;stroke:#e8d2c7" fill-opacity=".62" stroke-width=".7" opacity=".9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  </defs>
<rect x="0" y="0" width="260" height="360" fill="#f4e5dd"/>
<use xlink:href="#spray-emb"/>
</svg>
